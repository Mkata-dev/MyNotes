<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — QuickNotes</title>
  <meta name="description" content="Reset your QuickNotes account password." />

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Shared App Styles + Auth Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card" id="forgot-card">

      <!-- Header & Brand -->
      <div class="auth-card-brand">
        <div class="brand-icon-wrapper">
          <span class="material-symbols-outlined">edit_note</span>
        </div>
        <span class="brand-title">QuickNotes</span>
      </div>

      <div class="auth-card-header">
        <h1 class="auth-card-title">Reset Password</h1>
        <p class="auth-card-subtitle">Enter your username and your new password</p>
      </div>

      <!-- Forgot Password Form -->
      <form class="auth-form" id="forgot-form" onsubmit="return false;" novalidate>
        <div class="auth-alert" id="forgot-alert" hidden role="alert"></div>

        <div class="auth-field">
          <label class="auth-label" for="forgot-username">Username</label>
          <div class="auth-input-wrapper">
            <span class="material-symbols-outlined auth-input-icon">person</span>
            <input
              class="auth-input"
              type="text"
              id="forgot-username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="forgot-new-password">New Password</label>
          <div class="auth-input-wrapper">
            <span class="material-symbols-outlined auth-input-icon">lock</span>
            <input
              class="auth-input"
              type="password"
              id="forgot-new-password"
              name="new-password"
              placeholder="Enter new password (min 6 chars)"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <button class="btn btn-primary w-full auth-submit-btn" id="forgot-submit-btn" type="submit">
          <span id="forgot-btn-text">Reset Password</span>
          <span class="auth-spinner" id="forgot-spinner" hidden aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p class="auth-switch-text">
          Remember your password?
          <a class="auth-link" href="./login.html">Sign in</a>
        </p>

        <a href="./index.html" class="auth-back-link">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Back to Notes</span>
        </a>
      </div>

    </div>

    <!-- Success Confirmation Card -->
    <div class="auth-card auth-success-card" id="forgot-success-card" hidden>
      <div class="auth-success-circle">
        <span class="material-symbols-outlined">check_circle</span>
      </div>
      <h2 class="auth-card-title" style="margin-top: 1rem;">Password Reset!</h2>
      <p class="auth-card-subtitle" style="margin-top: 0.5rem; text-align: center;">Your password has been successfully updated. You can now sign in with your new credentials.</p>
      <a href="./login.html" class="btn btn-primary w-full" style="margin-top: 1.5rem; text-decoration: none;">
        <span>Go to Sign In</span>
      </a>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
