<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes — Fast, Minimalist Notes</title>
  <meta name="description" content="A lightweight, browser-based note-taking application that lets you capture thoughts, organize ideas, and auto-save locally with zero friction." />

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- Application Styles -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon-wrapper" aria-hidden="true">
        <span class="material-symbols-outlined">edit_note</span>
      </div>
      <span class="brand-title">QuickNotes</span>
      <div class="header-sync-status" title="Notes are saved securely in browser local storage">
        <span class="sync-pulse"></span>
        <span>Local Sync</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- Top Right Note Context Tools: Pin, Share, Delete, Three Dots -->
      <div class="header-note-actions" id="header-note-actions">
        <button class="icon-btn header-tool-btn" id="header-pin-btn" title="Pin / Unpin Note" type="button" aria-label="Pin Note">
          <span class="material-symbols-outlined text-[20px]">keep</span>
        </button>
        <button class="icon-btn header-tool-btn" id="header-share-btn" title="Share Note" type="button" aria-label="Share Note">
          <span class="material-symbols-outlined text-[20px]">share</span>
        </button>
        <button class="icon-btn header-tool-btn header-delete-btn" id="header-delete-btn" title="Delete Note" type="button" aria-label="Delete Note">
          <span class="material-symbols-outlined text-[20px]">delete</span>
        </button>
        <div class="header-more-menu-wrapper">
          <button class="icon-btn header-tool-btn" id="header-more-btn" title="More Options" type="button" aria-label="More Options">
            <span class="material-symbols-outlined text-[20px]">more_vert</span>
          </button>
          <div class="dropdown-menu" id="header-more-dropdown" hidden>
            <button class="dropdown-item" id="more-duplicate-btn" type="button">
              <span class="material-symbols-outlined text-[18px]">content_copy</span>
              <span>Duplicate Note</span>
            </button>
            <button class="dropdown-item" id="more-copy-text-btn" type="button">
              <span class="material-symbols-outlined text-[18px]">assignment</span>
              <span>Copy Plain Text</span>
            </button>
            <button class="dropdown-item" id="more-export-txt-btn" type="button">
              <span class="material-symbols-outlined text-[18px]">download</span>
              <span>Export as .txt</span>
            </button>
            <div class="dropdown-divider"></div>
            <div class="dropdown-info-item" id="more-stats-item">
              <span class="text-xs text-muted" id="header-more-stats">0 words · 0 chars</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Sign In / User Profile Dropdown -->
      <div class="header-auth-wrapper" id="header-auth-wrapper">
        <a href="./login.html" class="btn btn-secondary header-auth-btn" id="header-auth-btn" title="Sign In / Account">
          <span class="material-symbols-outlined text-[18px]" id="header-auth-icon">account_circle</span>
          <span class="auth-btn-label" id="header-auth-label">Sign In</span>
        </a>
        <div class="dropdown-menu auth-dropdown-menu" id="header-auth-dropdown" hidden>
          <div class="auth-dropdown-profile">
            <div class="auth-user-avatar" id="auth-avatar-initial">U</div>
            <div class="auth-user-details">
              <span class="auth-user-name" id="auth-user-name">User</span>
              <span class="auth-user-email" id="auth-user-email">user@example.com</span>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-info-item">
            <span class="material-symbols-outlined text-[16px] text-accent">cloud_done</span>
            <span>Cloud Account Connected</span>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item text-danger" id="auth-signout-btn" type="button">
            <span class="material-symbols-outlined text-[18px]">logout</span>
            <span>Sign Out</span>
          </button>
        </div>
      </div>

      <button class="btn btn-primary" id="header-new-note-btn" type="button">
        <span class="material-symbols-outlined text-[18px]">add</span>
        <span>New Note</span>
      </button>
    </div>
  </header>

  <!-- Two-Column Main Layout -->
  <main class="app-layout">
    <!-- Left Column: Notes Directory & Search (320px) -->
    <aside class="app-sidebar" aria-label="Notes sidebar">
      <div class="sidebar-controls">
        <!-- Primary Action Button -->
        <button class="btn btn-primary w-full" id="new-note-btn" type="button">
          <span class="material-symbols-outlined text-[18px]">add</span>
          <span>New Note</span>
          <span class="shortcut-badge">⌘N</span>
        </button>

        <!-- Search Input -->
        <div class="search-box">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" 
                 id="search-input" 
                 class="search-input" 
                 placeholder="Search notes (Ctrl+K)" 
                 aria-label="Search notes" />
          <kbd class="search-shortcut">⌘K</kbd>
        </div>

        <!-- Filter & Sort Row -->
        <div class="sidebar-action-row">
          <div class="filter-pills" id="filter-pills">
            <button class="filter-pill active" data-filter="all" type="button">
              All <span class="badge" id="all-count-badge">0</span>
            </button>
            <button class="filter-pill" data-filter="pinned" type="button">
              Pinned <span class="badge" id="pinned-count-badge">0</span>
            </button>
          </div>
          <button class="icon-btn ml-auto" id="sort-btn" title="Sort Notes (Updated, Created, Title)" type="button">
            <span class="material-symbols-outlined text-[18px]">swap_vert</span>
          </button>
        </div>
      </div>

      <!-- Scrollable Note Cards List -->
      <section class="notes-list-container" id="notes-list-container" aria-label="Notes list">
        <!-- Rendered dynamically by render.js -->
      </section>

      <!-- Sidebar Footer -->
      <footer class="sidebar-footer">
        <button class="sidebar-settings-btn" id="sidebar-settings-btn" type="button" title="Open Settings & Vault">
          <span class="material-symbols-outlined text-[18px]">settings</span>
          <span>Settings &amp; Vault</span>
        </button>
        <span class="text-faint text-[11px] font-mono">v1.0 Local</span>
      </footer>
    </aside>

    <!-- Right Column: Note Editor / Active Canvas -->
    <section class="editor-panel" id="editor-panel" aria-label="Note editor">
      <!-- Rendered dynamically by render.js -->
    </section>
  </main>

  <!-- Dynamic Modal Backdrop Container -->
  <div id="modal-container"></div>

  <!-- Dynamic Drawer Backdrop Container -->
  <div id="drawer-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
