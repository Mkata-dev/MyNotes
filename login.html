<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — QuickNotes</title>
  <meta name="description" content="Sign in to your QuickNotes account." />

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Shared App Styles + Auth Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Header & Brand -->
      <div class="auth-card-brand">
        <div class="brand-icon-wrapper">
          <span class="material-symbols-outlined">edit_note</span>
        </div>
        <span class="brand-title">QuickNotes</span>
      </div>

      <div class="auth-card-header">
        <h1 class="auth-card-title">Sign In</h1>
        <p class="auth-card-subtitle">Enter your username and password to continue</p>
      </div>

      <!-- Sign In Form -->
      <form class="auth-form" id="login-form" onsubmit="return false;" novalidate>
        <div class="auth-alert" id="login-alert" hidden role="alert"></div>

        <div class="auth-field">
          <label class="auth-label" for="login-username">Username</label>
          <div class="auth-input-wrapper">
            <span class="material-symbols-outlined auth-input-icon">person</span>
            <input
              class="auth-input"
              type="text"
              id="login-username"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="auth-field">
          <div class="auth-field-header">
            <label class="auth-label" for="login-password">Password</label>
            <a class="auth-link-subtle" href="./forgot-password.html">Forgot password?</a>
          </div>
          <div class="auth-input-wrapper">
            <span class="material-symbols-outlined auth-input-icon">lock</span>
            <input
              class="auth-input"
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button class="auth-toggle-pw" id="toggle-login-pw" type="button" title="Show/hide password" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined" id="toggle-login-pw-icon">visibility</span>
            </button>
          </div>
        </div>

        <button class="btn btn-primary w-full auth-submit-btn" id="login-submit-btn" type="submit">
          <span id="login-btn-text">Sign In</span>
          <span class="auth-spinner" id="login-spinner" hidden aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p class="auth-switch-text">
          Don't have an account?
          <a class="auth-link" href="./signup.html">Sign up</a>
        </p>

        <a href="./index.html" class="auth-back-link">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Back to Notes</span>
        </a>
      </div>

    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
