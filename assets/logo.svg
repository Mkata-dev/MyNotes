<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Accent / Pen Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#312E81" flood-opacity="0.35" />
    </filter>

    <!-- Note Inner Shadow -->
    <filter id="noteShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Container with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Rim Light / Inner Border -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

  <!-- Main Note Sheet -->
  <g filter="url(#noteShadow)">
    <rect x="30" y="28" width="60" height="72" rx="8" fill="#FFFFFF" />
    <!-- Top Fold / Accent Header Tab -->
    <rect x="30" y="28" width="60" height="12" rx="4" fill="#EEF2FF" />
    <circle cx="38" cy="34" r="2" fill="#818CF8" />
    <circle cx="44" cy="34" r="2" fill="#A5B4FC" />
  </g>

  <!-- Note Content Lines -->
  <rect x="38" y="48" width="34" height="4" rx="2" fill="#4338CA" />
  <rect x="38" y="58" width="44" height="3" rx="1.5" fill="#94A3B8" />
  <rect x="38" y="66" width="36" height="3" rx="1.5" fill="#CBD5E1" />
  <rect x="38" y="74" width="28" height="3" rx="1.5" fill="#E2E8F0" />

  <!-- Pen / Stylus Accent (Angled Floating Tool) -->
  <g transform="translate(68, 64) rotate(-35)">
    <!-- Pen Body -->
    <rect x="0" y="0" width="10" height="34" rx="4" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Pen Tip -->
    <polygon points="1,34 9,34 5,42" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="5" cy="41" r="1" fill="#0284C7" />
    <!-- Pen Cap Band -->
    <rect x="0" y="6" width="10" height="3" fill="#FFFFFF" fill-opacity="0.8" />
  </g>

  <!-- Sparkle Accent -->
  <path d="M96 26 L97.5 31 L102 32.5 L97.5 34 L96 39 L94.5 34 L90 32.5 L94.5 31 Z" fill="#FDE047" opacity="0.9" />
</svg>
