<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — QuickNotes</title>
  <meta name="description" content="Create your QuickNotes account." />

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <!-- Shared App Styles + Auth Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">

      <!-- Header & Brand -->
      <div class="auth-card-brand">
        <div class="brand-icon-wrapper">
          <span class="material-symbols-outlined">edit_note</span>
        </div>
        <span class="brand-title">QuickNotes</span>
      </div>

      <div class="auth-card-header">
        <h1 class="auth-card-title">Create Account</h1>
        <p class="auth-card-subtitle">Sign up with a username and password</p>
      </div>

      <!-- Sign Up Form -->
      <form class="auth-form" id="signup-form" onsubmit="return false;" novalidate>
        <div class="auth-alert" id="signup-alert" hidden role="alert"></div>

        <div class="auth-field">
          <label class="auth-label" for="signup-username">Username</label>
          <div class="auth-input-wrapper">
            <span class="material-symbols-outlined auth-input-icon">person</span>
            <input
              class="auth-input"
              type="text"
              id="signup-username"
              name="username"
              placeholder="Choose a username"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="signup-password">Password</label>
          <div class="auth-input-wrapper">
            <span class="material-symbols-outlined auth-input-icon">lock</span>
            <input
              class="auth-input"
              type="password"
              id="signup-password"
              name="password"
              placeholder="Create a password (min 6 chars)"
              autocomplete="new-password"
              required
            />
            <button class="auth-toggle-pw" id="toggle-signup-pw" type="button" title="Show/hide password" aria-label="Toggle password visibility">
              <span class="material-symbols-outlined" id="toggle-signup-pw-icon">visibility</span>
            </button>
          </div>
        </div>

        <button class="btn btn-primary w-full auth-submit-btn" id="signup-submit-btn" type="submit">
          <span id="signup-btn-text">Create Account</span>
          <span class="auth-spinner" id="signup-spinner" hidden style="display: none;" aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p class="auth-switch-text">
          Already have an account?
          <a class="auth-link" href="./login.html">Sign in</a>
        </p>

        <a href="./index.html" class="auth-back-link">
          <span class="material-symbols-outlined text-[18px]">arrow_back</span>
          <span>Back to Notes</span>
        </a>
      </div>

    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
